<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Transport v2</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#header {
    padding: 10px;
    background: #0078d4;
    color: white;
}

#filters {
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.filter {
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    background: #e6e6e6;
    cursor: pointer;
}

#map {
    height: calc(100vh - 110px);
}
</style>
</head>

<body>

<div id="header">
    <h2 style="margin:0">My Transport v2</h2>
</div>

<div id="filters">
    <button class="filter">56</button>
    <button class="filter">69</button>
    <button class="filter">506</button>
    <button class="filter">1</button>
    <button class="filter">2</button>
    <button class="filter">3</button>
    <button class="filter">10</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Käpylä
const map = L.map('map').setView([60.213, 24.949], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Käpylä marker
L.marker([60.213, 24.949])
 .addTo(map)
 .bindPopup("Käpylä");
</script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>

// Routes we care about
const wantedRoutes = [
    "1056",
    "1069",
    "1506"
];

// Store markers by vehicle ID
const vehicles = {};

// Connect
const client = mqtt.connect('wss://mqtt.hsl.fi:443');

client.on('connect', () => {

    console.log('Connected to HSL');

    // Subscribe to all vehicle updates
client.subscribe('/hfp/v2/journey/+/vp/+/+/+/1056/+/+/+/+/+/#');
client.subscribe('/hfp/v2/journey/+/vp/+/+/+/1069/+/+/+/+/+/#');
client.subscribe('/hfp/v2/journey/+/vp/+/+/+/1506/+/+/+/+/+/#');

console.log("Subscribed");;

});

client.on('message', (topic, message) => {
console.log(topic);
    try {

        const vp = JSON.parse(message.toString()).VP;

        if (!vp) return;

        const route = vp.desi;
        const lat = vp.lat;
        const lon = vp.long;
        const vehicleId = vp.veh;
        const vehicleKey = route + "-" + vehicleId;

        const routeNames = {
        "1056": "56",
       "1069": "69",
        "1506": "506"
};

const displayRoute = routeNames[route] || route;
        if (!lat || !lon) return;

        const isTram = ['1','2','3','10'].includes(route);

        const color = isTram ? '#00965E' : '#007AC9';

        const heading = vp.hdg || 0;



const icon = L.divIcon({
    className: '',
    html: `
        <div style="
            transform: rotate(${heading}deg);
            color:black;
            font-size:24px;
            font-weight:bold;
        ">
            ▲
        </div>
    `,
    iconSize: [24, 24],
    iconAnchor: [12, 12]
});

const marker = L.marker(
    [lat, lon],
    { icon }
).addTo(map);

            marker.bindTooltip(
                route,
                {
                    permanent: true,
                    direction: 'center'
                }
            );

            marker.bindPopup(
                `<b>${route}</b><br>
                Vehicle ${vehicleId}`
            );

            vehicles[vehicleId] = marker;
        

    } catch (err) {
        console.error(err);
    }

});

</script>
</body>
</html>
