<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Transport v2</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#header {
    padding: 10px;
    background: #0078d4;
    color: white;
}

#filters {
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.filter {
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    background: #e6e6e6;
    cursor: pointer;
}

#map {
    height: calc(100vh - 110px);
}
</style>
</head>

<body>

<div id="header">
    <h2 style="margin:0">My Transport v2</h2>
</div>

<div id="filters">
    <button class="filter">56</button>
    <button class="filter">69</button>
    <button class="filter">506</button>
    <button class="filter">1</button>
    <button class="filter">2</button>
    <button class="filter">3</button>
    <button class="filter">10</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Käpylä
const map = L.map('map').setView([60.213, 24.949], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Käpylä marker
L.marker([60.213, 24.949])
 .addTo(map)
 .bindPopup("Käpylä");

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</script>
<script>

// Routes we care about
const wantedRoutes = [
    "56",
    "69",
    "506",
    "1",
    "2",
    "3",
    "10"
];

// Store markers by vehicle ID
const vehicles = {};

// Connect
const client = mqtt.connect('wss://mqtt.hsl.fi:443');

client.on('connect', () => {

    console.log('Connected to HSL');

    // Subscribe to all vehicle updates
    client.subscribe('/hfp/v2/journey/ongoing/+/+/+/+/+/+/+/+/3/#');

});

client.on('message', (topic, message) => {

    try {

        const msg = JSON.parse(message.toString());

        if (!msg.VP) return;

        const vp = msg.VP;

        const route = vp.desi;

        // Filter routes
        if (!wantedRoutes.includes(route)) return;

        const lat = vp.lat;
        const lon = vp.long;

        if (!lat || !lon) return;

        // Unique vehicle ID
        const vehicleId = vp.veh;

        // Tram routes are 1,2,3,10
        const isTram = ["1", "2", "3", "10"].includes(route);

        const colour = isTram ? "#0078d4" : "#e74c3c";

        // Marker already exists → move it
        if (vehicles[vehicleId]) {

            vehicles[vehicleId].setLatLng([lat, lon]);

        } else {

            // Create a labelled circle marker
            const marker = L.circleMarker([lat, lon], {
                radius: 10,
                color: colour,
                fillColor: colour,
                fillOpacity: 0.8,
                weight: 2
            }).addTo(map);

            marker.bindTooltip(
                route,
                {
                    permanent: true,
                    direction: 'center',
                    className: 'route-label'
                }
            );

            marker.bindPopup(`
                <b>Route ${route}</b><br>
                Vehicle ${vehicleId}
            `);

            vehicles[vehicleId] = marker;
        }

    } catch (err) {
        console.error(err);
    }

});

</script>
</body>
</html>
