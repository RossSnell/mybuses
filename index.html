<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Transport</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#header {
    padding: 10px;
    background: #0078d4;
    color: white;
}

#filters {
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.filter {
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    background: #e6e6e6;
    cursor: pointer;
}

#map {
    height: calc(100vh - 110px);
}
</style>
</head>

<body>

<div id="header">
    <h2 style="margin:0">My Transport</h2>
</div>

<div id="filters">
    <button class="filter">56</button>
    <button class="filter">69</button>
    <button class="filter">506</button>
    <button class="filter">1</button>
    <button class="filter">2</button>
    <button class="filter">3</button>
    <button class="filter">10</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Käpylä
const map = L.map('map').setView([60.213, 24.949], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Käpylä marker
L.marker([60.213, 24.949])
 .addTo(map)
 .bindPopup("Käpylä");

</script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>
alert("MQTT type: " + typeof mqtt);
</script>
</body>
</html>
